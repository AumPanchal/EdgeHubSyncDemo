# 3-node mesh. Each node has its own Redis (with AOF persistence) and its own
# Python service. All nodes can reach all other nodes on the default network.


# Status endpoints on host:

# A -> localhost:8081/status
# B -> localhost:8082/status
# C -> localhost:8083/status


# DEMO COMMANDS:

# docker compose up --build           
# start the whole mesh

# curl localhost:8081/status | jq     
# peek at node A

# docker compose stop node-c          
# simulate C dropping

# docker compose start node-c         
# watch C catch up

# docker compose down -v              
# tear it all down (incl. volumes)

services:
  #Redis instances (one per node, AOF on)
  redis-a:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis-a-data:/data]

  redis-b:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis-b-data:/data]

  redis-c:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis-c-data:/data]

  # Nodes
  node-a:
    build: ./node
    environment:
      NODE_ID: A
      REDIS_URL: redis://redis-a:6379
      PORT: "8080"
      PEERS: "B=http://node-b:8080,C=http://node-c:8080"
      GEN_RATE: "0.5"
    depends_on: [redis-a]
    ports: ["8081:8080"]

  node-b:
    build: ./node
    environment:
      NODE_ID: B
      REDIS_URL: redis://redis-b:6379
      PORT: "8080"
      PEERS: "A=http://node-a:8080,C=http://node-c:8080"
      GEN_RATE: "0.5"
    depends_on: [redis-b]
    ports: ["8082:8080"]

  node-c:
    build: ./node
    environment:
      NODE_ID: C
      REDIS_URL: redis://redis-c:6379
      PORT: "8080"
      PEERS: "A=http://node-a:8080,B=http://node-b:8080"
      GEN_RATE: "0.5"
    depends_on: [redis-c]
    ports: ["8083:8080"]

volumes:
  redis-a-data:
  redis-b-data:
  redis-c-data:
